<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Realistic Scatter Slot</title>

<style>
    body {
        background: radial-gradient(circle, #111, #000);
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
    }

    h1 {
        margin-top: 20px;
        color: gold;
    }

    .machine {
        background: #222;
        width: 420px;
        margin: 30px auto;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 20px gold;
    }

    .reels {
        display: flex;
        justify-content: space-around;
        margin: 20px 0;
    }

    .reel {
        width: 90px;
        height: 90px;
        font-size: 50px;
        background: black;
        border: 3px solid gold;
        border-radius: 10px;
        line-height: 90px;
        animation: none;
    }

    .spinning {
        animation: spin 0.3s infinite;
    }

    @keyframes spin {
        0% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0); }
    }

    button {
        padding: 10px 30px;
        font-size: 18px;
        background: gold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
    }

    button:disabled {
        background: gray;
        cursor: not-allowed;
    }

    .info {
        margin-top: 15px;
        font-size: 18px;
    }

    .win {
        color: lime;
        font-weight: bold;
    }

    .lose {
        color: #ff4444;
    }
</style>
</head>

<body>

<h1>🎰 Scatter Slot Machine</h1>

<div class="machine">

    <div class="info">
        Balance: 💰 <span id="balance">1000</span><br>
        Bet: 💵 <span id="bet">50</span>
    </div>

    <div class="reels">
        <div class="reel" id="r1">❓</div>
        <div class="reel" id="r2">❓</div>
        <div class="reel" id="r3">❓</div>
    </div>

    <button id="spinBtn" onclick="spin()">SPIN</button>

    <div class="info" id="message"></div>

</div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"];
    const scatter = "⭐";

    let balance = 1000;
    let bet = 50;
    let freeSpins = 0;

    function randomSymbol() {
        return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function spin() {
        if (balance < bet && freeSpins === 0) {
            document.getElementById("message").textContent = "❌ Not enough balance!";
            return;
        }

        const reels = ["r1", "r2", "r3"];
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        if (freeSpins === 0) {
            balance -= bet;
        } else {
            freeSpins--;
        }

        updateBalance();

        reels.forEach(id => {
            const reel = document.getElementById(id);
            reel.classList.add("spinning");
        });

        setTimeout(() => {
            let results = reels.map(id => {
                const symbol = randomSymbol();
                const reel = document.getElementById(id);
                reel.textContent = symbol;
                reel.classList.remove("spinning");
                return symbol;
            });

            evaluate(results);
            btn.disabled = false;
        }, 1200);
    }

    function evaluate(results) {
        let msg = "";
        let winAmount = 0;

        const scatters = results.filter(s => s === scatter).length;

        if (scatters === 3) {
            freeSpins += 5;
            winAmount = bet * 10;
            msg = "🔥 JACKPOT! 3 SCATTERS + 5 FREE SPINS!";
        } 
        else if (scatters === 2) {
            freeSpins += 2;
            winAmount = bet * 5;
            msg = "✨ 2 SCATTERS! Free Spins Awarded!";
        }
        else if (results[0] === results[1] && results[1] === results[2]) {
            winAmount = bet * 3;
            msg = "🎉 MATCH WIN!";
        }
        else {
            msg = "😢 No win. Try again.";
        }

        balance += winAmount;
        updateBalance();

        document.getElementById("message").innerHTML =
            `<span class="${winAmount > 0 ? 'win' : 'lose'}">${msg}</span>` +
            (freeSpins > 0 ? `<br>🎁 Free Spins Left: ${freeSpins}` : "");
    }

    function updateBalance() {
        document.getElementById("balance").textContent = balance;
    }
</script>

</body>
</html>

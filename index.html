<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Scatter Slot Game</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #1b1b1b;
        color: white;
    }

    h1 {
        margin-top: 20px;
    }

    .slot-machine {
        display: flex;
        justify-content: center;
        margin: 30px 0;
    }

    .reel {
        width: 100px;
        height: 100px;
        border: 3px solid gold;
        margin: 0 10px;
        font-size: 50px;
        line-height: 100px;
        background: black;
    }

    button {
        padding: 10px 25px;
        font-size: 18px;
        cursor: pointer;
        background: gold;
        border: none;
        border-radius: 5px;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
    }
</style>
</head>

<body>

<h1>🎰 Scatter Slot Game</h1>

<div class="slot-machine">
    <div class="reel" id="reel1">❓</div>
    <div class="reel" id="reel2">❓</div>
    <div class="reel" id="reel3">❓</div>
</div>

<button onclick="spin()">SPIN</button>

<div id="result"></div>

<script>
    const symbols = ["🍒", "🍋", "🔔", "💎", "⭐"]; // ⭐ = Scatter

    function randomSymbol() {
        return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function spin() {
        const r1 = randomSymbol();
        const r2 = randomSymbol();
        const r3 = randomSymbol();

        document.getElementById("reel1").textContent = r1;
        document.getElementById("reel2").textContent = r2;
        document.getElementById("reel3").textContent = r3;

        let scatters = [r1, r2, r3].filter(s => s === "⭐").length;

        if (scatters >= 2) {
            document.getElementById("result").textContent =
                "🎉 YOU WIN! Scatter Activated!";
        } else {
            document.getElementById("result").textContent =
                "Try Again!";
        }
    }
</script>

</body>
</html>
